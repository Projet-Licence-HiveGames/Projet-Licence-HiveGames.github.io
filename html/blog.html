<!DOCTYPE html>
<html lang="fr">
    <head>
        <script
                type="module"
                src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"
        ></script>
        <meta charset="utf-8" />
        <link rel = "stylesheet" type = "text/css" href = "/css/styles.css"/>
        <title>Blog</title>
    </head>
    <body>
    <nav>
        <div class="logo">
            <a href="../index.html"><img src="../assets/HiveGamesStudio.png" alt="logo du blog"></a>
        </div>
        <div class="topNav">
            <a href="../index.html">Accueil</a>
            <a href="about.html">A propos</a>
        </div>
    </nav>

    <div id="container" class="container">
        <div id="language-selector" class="language-selector">
            Langue:
            <select id="select_language">
                <option value="fr">Français</option>
                <option value="en">English</option>
            </select>
        </div>
        <div id="blog-container" class="blog-container"></div>
    </div>
    <script>
        function getNews() {
            const newsContainer = document.getElementById('blog-container');
            const params = new URLSearchParams(window.location.search);
            const numBlog = parseInt(params.get('blog'), 10);
            const selectedLanguage = params.get('lang') || 'fr';
            fetch('../fileList.json')
                .then((res) => res.json())
                .then((data) => {
                    const itemFound = data.find((item) => item.id === numBlog);

                    if (itemFound) {
                        document.getElementById('select_language').value = selectedLanguage;

                        newsContainer.innerHTML = `<zero-md id="zero-md" src="../blogs/${selectedLanguage}/${itemFound.filename}.md"></zero-md>`;
                        document.title = `Blog du ${new Date(itemFound.date).toLocaleDateString('fr-FR')}`;
                    }
                })
                .catch((error) => {
                    console.error('Erreur lors du fetch:', error);
                });
        }

        document.getElementById('select_language').addEventListener('change', (event) => {
            const lang = event.target.value;
            window.location.href = `${window.location.pathname}?blog=${new URLSearchParams(window.location.search).get('blog')}&lang=${lang}`;
        });

        // refresh the html when the hash changes
        window.addEventListener('hashchange', () => {
            getNews();
        });
        getNews();
    </script>
    </body>
</html>
